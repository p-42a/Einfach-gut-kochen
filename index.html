  if(!m)return[0,"",esc(l)];
  const a=m[1].includes("/")?m[1].split("/").reduce((x,y)=>parseFloat(x)/parseFloat(y)):parseFloat(m[1].replace(",","."));

function faqView(){
  return `<button class="back" id="backMenu">← Menü</button><div class="faqs"><details class="faq"><summary>Wo werden meine Rezepte gespeichert?</summary><p>Nur auf deinem Gerät, im Speicher des Browsers. Es gibt kein Konto und keinen Server für Rezepte. Mach deshalb ab und zu eine Sicherung unter Einstellungen, Datensicherung.</p></details><details class="faq"><summary>Wie sichere ich meine Daten?</summary><p>Öffne Einstellungen, dann Datensicherung, und tippe auf „Sichern“. Du bekommst eine Datei mit Rezepten, Bildern, Favoriten und Listen. Mit „Wiederherstellen“ liest du sie wieder ein, zum Beispiel auf einem neuen Gerät. Vorhandenes bleibt dabei erhalten.</p></details><details class="faq"><summary>Wie teile ich die Einkaufsliste mit anderen?</summary><p>Tippe in der Einkaufsliste auf das Personen-Symbol und wähle „Neue gemeinsame Liste“. Schick den Code an die anderen. Sie geben ihn unter „Code eingeben“ ein und tippen auf „Beitreten“. Danach sehen alle dieselbe Liste. Es wird nur die Einkaufsliste geteilt, alles andere bleibt auf deinem Gerät.</p></details><details class="faq"><summary>Wer kann meine gemeinsame Liste sehen?</summary><p>Jeder, der den Code kennt. Gib ihn nur an Leute weiter, die mitmachen sollen. Wenn er woanders landet, trenne die Verbindung und erstelle eine neue Liste.</p></details><details class="faq"><summary>Wie lege ich ein eigenes Rezept an?</summary><p>Tippe in der Rezeptsuche auf das Plus. Schreibe die Zutaten eine pro Zeile, zum Beispiel „200 g Mehl“. Die Schritte kommen ebenfalls einer pro Zeile.</p></details><details class="faq"><summary>Wie finde ich Rezepte für das, was ich zu Hause habe?</summary><p>Gib in der Rezeptsuche bis zu drei Zutaten ein. Die App zeigt dir zuerst die Rezepte mit den meisten Treffern.</p></details><details class="faq"><summary>Wozu ist die Vorratskammer da?</summary><p>Sie zeigt, was du zu Hause hast. In der Einkaufsliste entscheidest du pro Artikel mit dem Kisten-Symbol, ob er nach dem Abhaken in den Vorrat kommt. Beim Kochen wird verbrauchte Ware abgezogen.</p></details><details class="faq"><summary>Wie genau sind die Nährwerte?</summary><p>Die App schätzt sie aus den Zutaten und zeigt sie pro Portion. Das sind grobe Richtwerte. Sie erscheinen nur, wenn die App fast alle Zutaten kennt.</p></details><details class="faq"><summary>Wie funktioniert der Wochenplan?</summary><p>Wähle im Wochenplan einen Tag und füge ein Rezept hinzu. Mit „Zutaten der Woche auf die Liste“ landen alle Zutaten in der Einkaufsliste.</p></details><details class="faq"><summary>Was passiert im Kochmodus?</summary><p>Der Bildschirm bleibt an, und du gehst Schritt für Schritt durch das Rezept. Schritt-Timer melden sich am Ende mit einem Ton.</p></details><details class="faq"><summary>Wie installiere ich die App auf dem iPhone?</summary><p>Öffne die App im Browser, tippe auf das Teilen-Symbol und wähle „Zum Home-Bildschirm“.</p></details><details class="faq"><summary>Funktioniert die App ohne Internet?</summary><p>Ja, nach dem ersten Laden. Nur die gemeinsame Einkaufsliste braucht eine Verbindung. Änderungen ohne Internet werden nachgeholt, sobald du wieder online bist.</p></details><details class="faq"><summary>Wie lösche ich alle Daten?</summary><p>Unter Einstellungen, Datensicherung, ganz unten auf „Alle Daten löschen“. Das lässt sich nicht rückgängig machen. Sichere vorher, wenn du etwas behalten willst.</p></details></div>`}

  <h4 class="grp2">Gemeinsame Einkaufsliste</h4><p>Nur wenn du sie in den Einstellungen einschaltest, wird die Einkaufsliste mit einem zufälligen Code bei einem Cloud-Dienst (Supabase) gespeichert, damit mehrere Geräte sie teilen können. Wer den Code kennt, kann die Liste sehen und ändern. Rezepte, Vorrat und Plan werden nicht übertragen.</p>

Wo werden meine Rezepte gespeichert?¦Where are my recipes stored?
Nur auf deinem Gerät, im Speicher des Browsers. Es gibt kein Konto und keinen Server für Rezepte. Mach deshalb ab und zu eine Sicherung unter Einstellungen, Datensicherung.¦Only on your device, in the browser's storage. There is no account and no server for recipes. Make a backup now and then under Settings, Data backup.
Wie sichere ich meine Daten?¦How do I back up my data?
Öffne Einstellungen, dann Datensicherung, und tippe auf „Sichern“. Du bekommst eine Datei mit Rezepten, Bildern, Favoriten und Listen. Mit „Wiederherstellen“ liest du sie wieder ein, zum Beispiel auf einem neuen Gerät. Vorhandenes bleibt dabei erhalten.¦Open Settings, then Data backup, and tap “Back up”. You get a file with recipes, images, favourites and lists. “Restore” reads it back in, for example on a new device. Existing data is kept.
Wie teile ich die Einkaufsliste mit anderen?¦How do I share the shopping list with others?
Tippe in der Einkaufsliste auf das Personen-Symbol und wähle „Neue gemeinsame Liste“. Schick den Code an die anderen. Sie geben ihn unter „Code eingeben“ ein und tippen auf „Beitreten“. Danach sehen alle dieselbe Liste. Es wird nur die Einkaufsliste geteilt, alles andere bleibt auf deinem Gerät.¦In the shopping list, tap the people icon and choose “New shared list”. Send the code to the others. They enter it under “Enter code” and tap “Join”. After that everyone sees the same list. Only the shopping list is shared, everything else stays on your device.
Wer kann meine gemeinsame Liste sehen?¦Who can see my shared list?
Jeder, der den Code kennt. Gib ihn nur an Leute weiter, die mitmachen sollen. Wenn er woanders landet, trenne die Verbindung und erstelle eine neue Liste.¦Anyone who knows the code. Only give it to people who should take part. If it ends up somewhere else, disconnect and create a new list.
Wie lege ich ein eigenes Rezept an?¦How do I add my own recipe?
Tippe in der Rezeptsuche auf das Plus. Schreibe die Zutaten eine pro Zeile, zum Beispiel „200 g Mehl“. Die Schritte kommen ebenfalls einer pro Zeile.¦In recipe search, tap the plus. Write the ingredients one per line, for example “200 g flour”. The steps also go one per line.
Wie finde ich Rezepte für das, was ich zu Hause habe?¦How do I find recipes for what I have at home?
Gib in der Rezeptsuche bis zu drei Zutaten ein. Die App zeigt dir zuerst die Rezepte mit den meisten Treffern.¦Enter up to three ingredients in recipe search. The app shows the recipes with the most matches first.
Wozu ist die Vorratskammer da?¦What is the pantry for?
Sie zeigt, was du zu Hause hast. In der Einkaufsliste entscheidest du pro Artikel mit dem Kisten-Symbol, ob er nach dem Abhaken in den Vorrat kommt. Beim Kochen wird verbrauchte Ware abgezogen.¦It shows what you have at home. In the shopping list you decide per item with the box icon whether it goes into the pantry after you tick it off. Used ingredients are subtracted while cooking.
Wie genau sind die Nährwerte?¦How accurate are the nutrition values?
Die App schätzt sie aus den Zutaten und zeigt sie pro Portion. Das sind grobe Richtwerte. Sie erscheinen nur, wenn die App fast alle Zutaten kennt.¦The app estimates them from the ingredients and shows them per serving. They are rough guidelines. They only appear when the app knows almost all ingredients.
Wie funktioniert der Wochenplan?¦How does the meal plan work?
Wähle im Wochenplan einen Tag und füge ein Rezept hinzu. Mit „Zutaten der Woche auf die Liste“ landen alle Zutaten in der Einkaufsliste.¦In the meal plan, pick a day and add a recipe. With “Add this week's ingredients to the list”, all ingredients land on the shopping list.
Was passiert im Kochmodus?¦What happens in cooking mode?
Der Bildschirm bleibt an, und du gehst Schritt für Schritt durch das Rezept. Schritt-Timer melden sich am Ende mit einem Ton.¦The screen stays on and you go through the recipe step by step. Step timers sound an alert when they finish.
Wie installiere ich die App auf dem iPhone?¦How do I install the app on my iPhone?
Öffne die App im Browser, tippe auf das Teilen-Symbol und wähle „Zum Home-Bildschirm“.¦Open the app in the browser, tap the share icon and choose “Add to Home Screen”.
Funktioniert die App ohne Internet?¦Does the app work offline?
Ja, nach dem ersten Laden. Nur die gemeinsame Einkaufsliste braucht eine Verbindung. Änderungen ohne Internet werden nachgeholt, sobald du wieder online bist.¦Yes, after the first load. Only the shared shopping list needs a connection. Changes made offline are synced once you are back online.
Wie lösche ich alle Daten?¦How do I delete all data?
Unter Einstellungen, Datensicherung, ganz unten auf „Alle Daten löschen“. Das lässt sich nicht rückgängig machen. Sichere vorher, wenn du etwas behalten willst.¦Under Settings, Data backup, at the very bottom tap “Delete all data”. This cannot be undone. Back up first if you want to keep something.
Alle Rezepte, Bilder, Listen, Pläne und Einstellungen liegen ausschließlich im Speicher deines Browsers auf diesem Gerät. Die App hat keine Konten und keinen eigenen Server für deine Rezepte. Einzige Ausnahme ist die optionale gemeinsame Einkaufsliste (siehe unten).¦All recipes, images, lists, plans and settings are stored only in your browser's storage on this device. The app has no accounts and no server of its own for your recipes. The only exception is the optional shared shopping list (see below).
Nur wenn du sie in den Einstellungen einschaltest, wird die Einkaufsliste mit einem zufälligen Code bei einem Cloud-Dienst (Supabase) gespeichert, damit mehrere Geräte sie teilen können. Wer den Code kennt, kann die Liste sehen und ändern. Rezepte, Vorrat und Plan werden nicht übertragen.¦Only if you turn it on in the settings is the shopping list stored with a random code at a cloud service (Supabase) so that several devices can share it. Anyone who knows the code can see and change the list. Recipes, pantry and plan are not transmitted.
Die App setzt keine Werbe- oder Analyse-Dienste ein und lädt keine externen Schriften.¦The app uses no advertising or analytics services and loads no external fonts.
Beim Aufruf der App kann der Hosting-Anbieter technisch bedingt Zugriffsdaten (z. B. IP-Adresse, Zeitpunkt) in Server-Logs erfassen.¦When you open the app, the hosting provider may record access data (e.g. IP address, time) in server logs for technical reasons.

function parseText(t){
  const fr={"½":"1/2","¼":"1/4","¾":"3/4","⅓":"1/3"};
  const lines=t.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean);
  const ZH=/^(zutaten|einkaufsliste)$/i,SH=/^(zubereitung|anleitung|zubereitungsschritte|schritte|methode|so geht['’]?s)$/i;
  const o={t:"",s:0,min:0,ing:[],st:[],ov:false};let mode="",ovl=null;
  for(const l of lines){
    const h=l.replace(/[:：]\s*$/,"");
    if(ZH.test(h)){mode="i";continue}
    if(SH.test(h)){mode="s";continue}
    let m;
    if((m=l.match(/^ofen\s*:\s*(\d{2,3})\s*°\s*C\D+(\d{1,3})\s*Min\D+(\d{1,2})/i))){ovl={ot:+m[1],om:+m[2],oi:+m[3]};continue}
    if(l.length<60&&(m=l.match(/(\d{1,2})\s*(?:Portionen?|Personen|Port\.)|(?:Portionen?|Personen)\s*:?\s*(\d{1,2})/i))){o.s=+(m[1]||m[2]);const z=l.match(/(\d{1,3})\s*(?:Min|Minuten)/i);if(z)o.min=+z[1];continue}
    if(l.length<60&&(m=l.match(/^(?:zeit|dauer|arbeitszeit|gesamtzeit|zubereitungszeit)\s*:?\s*(?:ca\.?\s*)?(\d{1,3})\s*(?:Min|Minuten)/i))){o.min=+m[1];continue}
    if(!o.t&&!mode){o.t=l.replace(/^#+\s*/,"").slice(0,60);continue}
    const isStep=/^\d+[.)]\s+\S/.test(l),txt=l.replace(/^[-•*–]\s*/,"").replace(/^\d+[.)]\s+/,"");
    let kind=mode;if(!kind)kind=(isStep||txt.length>45||/[.!]$/.test(txt))?"s":"i";
    if(kind==="i")o.ing.push(txt.replace(/[½¼¾⅓]/g,x=>fr[x]));else o.st.push(txt);
  }

function syxMirror(n,rem){const y=prof().sync;y.c=y.c||{};const c=y.c[n]=y.c[n]||{snap:{},del:{},ts:{}};const items=((rem&&rem.items)||[]).filter(r=>r&&r.id);

function syNormAll(o){o=(Array.isArray(o)||!o)?{items:[]}:o;const col=p=>({i:[...((p&&p.items)||[])].sort((a,b)=>a.id<b.id?-1:1),d:Object.keys((p&&p.del)||{}).sort().map(k=>[k,p.del[k]])});return JSON.stringify({s:col(o),x:["pantry","recipes","plan"].map(n=>col(o.x&&o.x[n])),c:o.cfg||null})}

  }catch(e){syStat="err"}

}

function syCode(){const A="23456789ABCDEFGHJKLMNPQRSTUVWXYZ",b=new Uint8Array(12);crypto.getRandomValues(b);return[...b].map(x=>A[x%A.length]).join("")}
